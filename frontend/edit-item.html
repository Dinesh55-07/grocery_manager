<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Grocery Item</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body data-page="form" data-mode="edit">
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-basket-shopping me-2"></i>Grocery List Manager</a>
      <div class="ms-auto">
        <a class="nav-link text-white" href="index.html">Back to Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-8">
        <section class="card app-card">
          <div class="card-body p-4 p-md-5">
            <div class="mb-4">
              <p class="eyebrow mb-2">Edit Item</p>
              <h1 class="h3 fw-bold mb-0">Update Grocery Item</h1>
            </div>
            <form id="itemForm" class="row g-3">
              <input type="hidden" id="itemId" />
              <div class="col-md-6">
                <label class="form-label">Item Name *</label>
                <input id="itemName" class="form-control form-control-lg" maxlength="100" required />
              </div>
              <div class="col-md-3">
                <label class="form-label">Quantity *</label>
                <input id="quantity" type="number" min="1" class="form-control form-control-lg" required />
              </div>
              <div class="col-md-3">
                <label class="form-label">Unit</label>
                <input id="unit" class="form-control form-control-lg" placeholder="pcs, kg, pack" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Category *</label>
                <input id="category" class="form-control form-control-lg" list="categoryList" required />
                <datalist id="categoryList"></datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label">Price</label>
                <input id="price" type="number" min="0" step="0.01" class="form-control form-control-lg" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Purchase Date</label>
                <input id="purchaseDate" type="date" class="form-control form-control-lg" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Priority</label>
                <select id="priority" class="form-select form-select-lg">
                  <option>High</option>
                  <option selected>Medium</option>
                  <option>Low</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Status</label>
                <select id="status" class="form-select form-select-lg">
                  <option>Pending</option>
                  <option>Purchased</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Notes</label>
                <input id="notes" class="form-control form-control-lg" />
              </div>
              <div class="col-12 d-flex flex-wrap gap-2 pt-2">
                <button class="btn btn-success btn-lg px-4" type="submit"><i class="fa-solid fa-pen-to-square me-2"></i>Update Item</button>
                <a class="btn btn-outline-secondary btn-lg" href="index.html">Cancel</a>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/form.js"></script>
</body>
</html>
