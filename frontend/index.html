<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery List Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body data-page="dashboard">
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container-fluid">

    <!-- Left -->
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="fa-solid fa-basket-shopping me-2"></i>
      Grocery List Manager
    </a>

    <!-- Right -->
    <div class="ms-auto">
      <a href="add-item.html" class="btn btn-light">
        <i class="fa-solid fa-plus me-2"></i>Add Item
      </a>
    </div>

  </div>
</nav>

  <main class="container-fluid px-4 py-4">
    <section class="row g-3 mb-4" id="statsRow"></section>
    <section class="row g-3 mb-4" id="costSummaryRow"></section>

    <section class="card app-card mb-4">
      <div class="card-body p-3 p-md-4">
        <div class="row g-3 align-items-center">
          <div class="col-xl-4">
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input id="searchInput" type="search" class="form-control" placeholder="Search by name, category, or notes" />
            </div>
          </div>
          <div class="col-xl-2 col-md-4">
            <select id="categoryFilter" class="form-select form-select-lg">
              <option value="all">All Categories</option>
            </select>
          </div>
          <div class="col-xl-2 col-md-4">
            <select id="priorityFilter" class="form-select form-select-lg">
              <option value="all">All Priorities</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="col-xl-2 col-md-4">
            <select id="statusFilter" class="form-select form-select-lg">
              <option value="all">All Status</option>
              <option value="Pending">Pending</option>
              <option value="Purchased">Purchased</option>
            </select>
          </div>
          <div class="col-xl-2 d-flex gap-2 justify-content-xl-end">
            <select id="sortSelect" class="form-select form-select-lg">
              <option value="recent">Recently Added</option>
              <option value="name-asc">Item Name A-Z</option>
              <option value="name-desc">Item Name Z-A</option>
              <option value="price-asc">Price Low-High</option>
              <option value="price-desc">Price High-Low</option>
              <option value="qty-asc">Quantity Low-High</option>
              <option value="qty-desc">Quantity High-Low</option>
              <option value="date-asc">Purchase Date Old-New</option>
              <option value="date-desc">Purchase Date New-Old</option>
            </select>
          </div>
        </div>
        <div class="row g-3 align-items-center mt-1">
          <div class="col-md-4 col-lg-3">
            <label class="form-label mb-1">Display Mode</label>
            <select id="displayModeSelect" class="form-select form-select-lg">
              <option value="combined">Show Both Pending and Purchased</option>
              <option value="separate">Separate Pending and Purchased</option>
            </select>
          </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <button id="cardViewBtn" class="btn btn-outline-success active" type="button"><i class="fa-solid fa-border-all me-2"></i>Card View</button>
          <button id="tableViewBtn" class="btn btn-outline-success" type="button"><i class="fa-solid fa-table me-2"></i>Table View</button>
          <button id="exportBtn" class="btn btn-outline-secondary ms-auto" type="button"><i class="fa-solid fa-file-csv me-2"></i>Export CSV</button>
          <button id="printBtn" class="btn btn-outline-secondary" type="button"><i class="fa-solid fa-print me-2"></i>Print</button>
        </div>
      </div>
    </section>

    <section class="card app-card">
      <div class="card-body p-3 p-md-4">
        <div id="loadingState" class="text-center py-5 d-none">
          <div class="spinner-border text-success" role="status"></div>
          <p class="mt-3 mb-0">Loading grocery items...</p>
        </div>
        <div id="itemsContainer"></div>
        <div id="emptyState" class="empty-state d-none text-center py-5">
          <i class="fa-solid fa-cart-shopping fa-3x mb-3 text-success"></i>
          <h4 class="fw-bold">No grocery items yet</h4>
          <p class="text-muted mb-4">Add your first item to start managing your grocery list.</p>
          <a href="add-item.html" class="btn btn-success px-4">Add First Item</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
